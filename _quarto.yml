project:
  type: website
  output-dir: docs

website:
  title: "BCB520_Data_Visualization"
  navbar:
    right:
      - about.qmd
      - icon: github
        href: https://github.com/
      - icon: twitter
        href: https://twitter.com

format:
  html:
    theme: cosmo
    page-layout: full
    css: styles.css
    df-print: paged


editor: 
  theme: visual
  theme-tweaks:
    primary: "#007bff"
    secondary: "#6c757d"
    success: "#28a745"
    info: "#17a2b8"
    warning: "#ffc107"
    danger: "#dc3545"
    light: "#f8f9fa"
    dark: "#343a40"
    body-bg: "#ffffff"
    body-color: "#212529"
  font:
    text: "Arial, sans-serif"
    code: "Courier New, monospace"

quarto-required: ">=1.3.0"
